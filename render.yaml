services:
  - type: web
    name: multi-agent-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.backend.api:app --host 0.0.0.0 --port $PORT

  - type: web
    name: multi-agent-frontend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/frontend/ui.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: BACKEND_URL
        value: "https://<your-backend-service>.onrender.com/chat"
